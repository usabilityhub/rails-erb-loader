name: Build

on: [push]

jobs:
  build:
    name: Test Plugin

    strategy:
      # Due to timeout randomly happening in different versions
      # This help prevent other jobs from being canceled due to those timeouts
      fail-fast: false
      matrix:
        node-version: [24.x]
        ruby:
          - "3.4"
          - "4.0"
        webpack:
          - "2"
          - "3"
          - "4"
          - "5"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          # Run `bundle install` with cache when `true`
          bundler-cache: true
          # Some gems require more recent rubygems version
          rubygems: latest

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm install webpack@${{ matrix.webpack }} --no-save && bundle exec npm run test
