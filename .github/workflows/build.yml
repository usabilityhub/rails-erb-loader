name: Build

on: [push]

jobs:
  build:
    name: Test Plugin

    strategy:
      matrix:
        node-version: [24.x]
        ruby:
          - "3.4"
          - "4.0"
        webpack:
          - "2"
          - "3"
          - "4"
          - "5"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          ruby-version: ${{ matrix.ruby }}
          # Run `bundle install` with cache when `true`
          bundler-cache: true
          # Some gems require more recent rubygems version
          rubygems: latest

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm install webpack@${{ matrix.webpack }} --no-save && bundle exec npm run test
